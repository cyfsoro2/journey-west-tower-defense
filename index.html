<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>西行守心 · 战斗演示</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171f1d;color:#f1e7cb;font-family:Georgia,'Songti SC',serif}main{max-width:1080px;margin:auto;padding:32px 24px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{color:#dfae61;letter-spacing:.2em;font-size:12px}h1{font-size:42px;letter-spacing:.12em;margin:8px 0}p{color:#b6bca9;line-height:1.6}button{border:1px solid #6e775f;background:#29372e;color:#f5eacb;border-radius:5px;padding:12px 18px;cursor:pointer;font:inherit}button:hover,button.selected{background:#d3a757;color:#18251b;border-color:#d3a757}.panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.panel span{color:#b6bca9;font-size:14px}.board{position:relative;border:1px solid #6e775f;background:#1e2d24;box-shadow:0 15px 50px #0005}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.status{display:flex;justify-content:space-between;gap:12px;color:#dfc898;font-size:14px}.message{color:#e2ba78;min-height:1.5em}footer{font-size:13px;color:#879383;margin-top:16px}@media(max-width:600px){main{padding:18px 12px}h1{font-size:30px}.top{display:block}.panel button{padding:10px}}
</style></head><body><main><div class="top"><div><div class="eyebrow">JOURNEY WEST · PROTOTYPE 01</div><h1>西行守心</h1><p>妖风将至，守住取经人。布置悟空与八戒，抵挡第一波小妖</p></div><button id="restart">重新开始</button></div><div class="panel"><button id="wukong" class="selected">① 孙悟空 · 范围攻击</button><button id="bajie">② 猪八戒 · 近战阻挡</button><button id="start">开始战斗</button><span>选择角色后点击空白格放置，每人限一个</span></div><div class="status"><span id="health">唐僧生命 100 / 100</span><span id="wave">准备阶段</span></div><div class="board"><canvas id="game" width="960" height="576" aria-label="塔防战斗地图"></canvas></div><p class="message" id="message" aria-live="polite">先选择角色，再点击地图放置</p><footer>玩法验证版 · 第一波 10 只小妖 · 使用简单图形占位</footer></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const cell=64, cols=15, rows=9, center={x:7,y:4}, startBtn=document.querySelector('#start'),message=document.querySelector('#message');
let state,last=0,selected='wukong';
function reset(){state={phase:'prepare',hp:100,units:[],enemies:[],spawned:0,spawnTimer:0,flash:0};selected='wukong';select('wukong');startBtn.disabled=false;message.textContent='先选择角色，再点击地图放置';updateLabels()}
function select(kind){selected=kind;for(const id of ['wukong','bajie'])document.querySelector('#'+id).classList.toggle('selected',id===kind)}
function updateLabels(){document.querySelector('#health').textContent=`唐僧生命 ${Math.max(0,Math.ceil(state.hp))} / 100`;document.querySelector('#wave').textContent=state.phase==='prepare'?'准备阶段':state.phase==='battle'?`第一波 · 已出现 ${state.spawned} / 10`:state.phase==='won'?'第一波守住了':'取经人倒下了'}
document.querySelector('#wukong').onclick=()=>select('wukong');document.querySelector('#bajie').onclick=()=>select('bajie');document.querySelector('#restart').onclick=reset;
startBtn.onclick=()=>{if(state.phase!=='prepare')return;if(!state.units.length){message.textContent='请先放置至少一个角色';return}state.phase='battle';startBtn.disabled=true;message.textContent='小妖来了！点击角色按钮仍可补充放置';updateLabels()};
canvas.addEventListener('pointerdown',event=>{if(!['prepare','battle'].includes(state.phase))return;const rect=canvas.getBoundingClientRect(),x=Math.floor((event.clientX-rect.left)*canvas.width/rect.width/cell),y=Math.floor((event.clientY-rect.top)*canvas.height/rect.height/cell);if(x<0||x>=cols||y<0||y>=rows||(x===center.x&&y===center.y)||state.units.some(u=>u.x===x&&u.y===y)){message.textContent='这个位置不能放置';return}if(state.units.some(u=>u.kind===selected)){message.textContent='这个角色已经上阵了';return}state.units.push({kind:selected,x,y,cooldown:0,hp:selected==='bajie'?150:90});message.textContent=selected==='wukong'?'悟空已上阵':'八戒已上阵'});
function spawn(){const points=[[0,4],[14,4],[7,0],[7,8]],p=points[state.spawned%4];state.enemies.push({x:p[0]+.5,y:p[1]+.5,hp:60,attack:0});state.spawned++}
function update(dt){if(state.phase!=='battle')return;state.spawnTimer-=dt;if(state.spawned<10&&state.spawnTimer<=0){spawn();state.spawnTimer=1.35}for(const u of state.units){u.cooldown-=dt;const range=u.kind==='wukong'?2.5:1.05;const targets=state.enemies.filter(e=>Math.hypot(e.x-u.x-.5,e.y-u.y-.5)<range).sort((a,b)=>Math.hypot(a.x-u.x-.5,a.y-u.y-.5)-Math.hypot(b.x-u.x-.5,b.y-u.y-.5));if(targets.length&&u.cooldown<=0){const target=targets[0];if(u.kind==='wukong'){for(const e of state.enemies)if(Math.hypot(e.x-target.x,e.y-target.y)<.75)e.hp-=25}else target.hp-=18;u.cooldown=u.kind==='wukong'?0.85:0.8;state.flash=.12}}
for(const e of state.enemies){if(e.hp<=0)continue;const blocker=state.units.find(u=>u.kind==='bajie'&&u.hp>0&&Math.hypot(e.x-u.x-.5,e.y-u.y-.5)<.65);e.attack-=dt;if(blocker){if(e.attack<=0){blocker.hp-=8;e.attack=1}continue}const dx=center.x+.5-e.x,dy=center.y+.5-e.y,dist=Math.hypot(dx,dy);if(dist<.48){if(e.attack<=0){state.hp-=8;e.attack=1}}else{const step=Math.min(dist,dt*.65);e.x+=dx/dist*step;e.y+=dy/dist*step}}
state.units=state.units.filter(u=>u.hp>0);state.enemies=state.enemies.filter(e=>e.hp>0);state.flash=Math.max(0,state.flash-dt);if(state.hp<=0){state.hp=0;state.phase='lost';message.textContent='唐僧血量耗尽，点击重新开始再试一次'}else if(state.spawned===10&&state.enemies.length===0){state.phase='won';message.textContent='第一波守住了！点击重新开始再试一次'}updateLabels()}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function label(text,x,y,color='#fff1cf',size=15){ctx.fillStyle=color;ctx.font=`bold ${size}px Georgia, serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#263a2c';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){ctx.strokeStyle='#ffffff0c';ctx.strokeRect(x*cell,y*cell,cell,cell)}ctx.fillStyle='#aa9c6a20';ctx.fillRect(0,4*cell,canvas.width,cell);ctx.fillRect(7*cell,0,cell,canvas.height);const cx=(center.x+.5)*cell,cy=(center.y+.5)*cell;circle(cx,cy,27,'#ba7650');label('唐',cx,cy,'#fff2d5',23);for(const u of state.units){let x=(u.x+.5)*cell,y=(u.y+.5)*cell;circle(x,y,25,u.kind==='wukong'?'#d7a746':'#92a67a');label(u.kind==='wukong'?'悟':'戒',x,y,'#1d2a1f',22);ctx.fillStyle='#f2e4bb';ctx.fillRect(x-20,y-34,40*Math.max(0,u.hp)/(u.kind==='bajie'?150:90),3)}for(const e of state.enemies){let x=e.x*cell,y=e.y*cell;circle(x,y,15,'#ad685c');label('妖',x,y,'#f5e3ce',13);ctx.fillStyle='#ead4a9';ctx.fillRect(x-15,y-23,30*Math.max(0,e.hp)/60,3)}if(state.phase==='won'||state.phase==='lost'){ctx.fillStyle='#111c17c9';ctx.fillRect(0,0,canvas.width,canvas.height);label(state.phase==='won'?'守住了！':'再战一次',canvas.width/2,canvas.height/2,'#f5db9e',42)}}
function loop(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
